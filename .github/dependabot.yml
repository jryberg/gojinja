version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /docs/site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      docs:
        patterns: ["*"]
