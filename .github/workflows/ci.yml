name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && 'ci-schedule' || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.os }} / go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  audit-and-lint:
    name: audit + staticcheck + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - name: make audit
        run: make audit
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: staticcheck
        run: staticcheck ./...
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...

  parity:
    name: parity (linux only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install jinja2
        run: python -m pip install --user jinja2
      - name: make parity
        run: make parity

  parity-external:
    name: parity-external (manual / weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --user jinja2
      - name: parity-external
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make parity-external-fetch
          make parity-external

  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: verify Signed-off-by on all commits in PR
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          commits=$(git rev-list "$base..$head")
          if [ -z "$commits" ]; then
            echo "::error::no commits between $base and $head; refusing to silently pass"
            exit 1
          fi
          missing=0
          while IFS= read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: '; then
              echo "::error::commit $sha is missing Signed-off-by"
              missing=1
            fi
          done <<< "$commits"
          exit "$missing"
