version: 2

project_name: gojinja

before:
  hooks:
    - go mod tidy

builds:
  - id: gojinja
    main: ./cmd/gojinja
    binary: gojinja
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: gojinja
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive
    disable: '{{ if .IsSnapshot }}true{{ end }}'

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: Breaking changes
      regexp: '^(\w+ )?\w+(\(.+\))?!:'
      order: 0
    - title: Features
      regexp: '^(\w+ )?feat(\(.+\))?:'
      order: 1
    - title: Bug fixes
      regexp: '^(\w+ )?fix(\(.+\))?:'
      order: 2
    - title: Performance
      regexp: '^(\w+ )?perf(\(.+\))?:'
      order: 3
    - title: Documentation
      regexp: '^(\w+ )?docs(\(.+\))?:'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^(\w+ )?(test|ci|chore|build|style|refactor)(\(.+\))?:'

release:
  github:
    owner: jryberg
    name: gojinja
  draft: false
  prerelease: auto
